[workspace]
members = [".", "crates/max-api", "crates/max-infra", "crates/max-config", "crates/max-log", "crates/max-log/tests/fixtures/attribution-macro-support", "crates/max-log/tests/fixtures/attribution-macro-consumer", "crates/max-tls", "crates/max-relay-proto", "apps/maxrelay", "crates/max-spawn", "crates/max-commands", "crates/max-providers", "crates/max-memory", "crates/max-channels", "crates/max-tools", "crates/max-sop-graph", "crates/max-runtime", "crates/max-eval", "apps/maxcode", "crates/max-plugins", "crates/max-plugins/tests/fixtures/channel-fixture", "crates/max-plugins/tests/fixtures/egress-fixture", "crates/max-plugins/tests/fixtures/tool-fixture", "crates/max-plugins/tests/fixtures/tool-timeout-fixture", "crates/max-plugins/tests/fixtures/tool-sequential-fixture", "crates/max-plugins/tests/fixtures/tool-secret-fixture", "crates/max-gateway", "crates/max-hardware", "crates/max-tool-call-parser", "crates/max-macros", "apps/tauri", "tools/fill-translations", "xtask"]
resolver = "2"

[workspace.package]
version = "0.8.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/max-labs/max"
homepage = "https://www.max.com"
rust-version = "1.96.0"

[workspace.dependencies]
max-api = { path = "crates/max-api", version = "0.8.5" }
max-infra = { path = "crates/max-infra", version = "0.8.5" }
max-config = { path = "crates/max-config", version = "0.8.5", default-features = false }
max-log = { path = "crates/max-log", version = "0.8.5" }
max-tls = { path = "crates/max-tls", version = "0.8.5" }
max-relay-proto = { path = "crates/max-relay-proto", version = "0.8.5" }
maxrelay = { path = "apps/maxrelay", version = "0.8.5" }
max-spawn = { path = "crates/max-spawn", version = "0.8.5" }
max-commands = { path = "crates/max-commands", version = "0.8.5" }
max-providers = { path = "crates/max-providers", version = "0.8.5" }
max-memory = { path = "crates/max-memory", version = "0.8.5" }
max-channels = { path = "crates/max-channels", version = "0.8.5", default-features = false }
max-tools = { path = "crates/max-tools", version = "0.8.5" }
max-sop-graph = { path = "crates/max-sop-graph", version = "0.8.5", default-features = false }
max-runtime = { path = "crates/max-runtime", version = "0.8.5", default-features = false }
max-eval = { path = "crates/max-eval", version = "0.8.5" }
max-plugins = { path = "crates/max-plugins", version = "0.8.5" }
max-gateway = { path = "crates/max-gateway", version = "0.8.5" }
max-hardware = { path = "crates/max-hardware", version = "0.8.5" }
max-tool-call-parser = { path = "crates/max-tool-call-parser", version = "0.8.5" }
max-macros = { path = "crates/max-macros", version = "0.8.5" }
maxcode = { path = "apps/maxcode", version = "0.8.5" }
directories = "6.0"
sys-locale = "0.3"

[package]
name = "max"
# Workspace crates are publish = false during microkernel transition.
publish = true
default-run = "max"
version.workspace = true
edition.workspace = true
authors = ["theonlyhennygod"]
license.workspace = true
description = "Zero overhead. Zero compromise. 100% Rust. The fastest, smallest AI assistant."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.max.com"
readme = "README.md"
keywords = ["ai", "agent", "cli", "assistant", "chatbot"]
categories = ["command-line-utilities", "api-bindings"]
rust-version.workspace = true
include = [
  "/src/**/*",
  "/build.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE*",
  "/README.md",
  "/web/dist/**/*",
  "/locales/**/*",
]

[[bin]]
name = "max"
path = "src/main.rs"

[[bin]]
name = "max-acp-bridge"
path = "src/bin/max-acp-bridge.rs"
required-features = ["acp-bridge"]

[lib]
name = "max"
path = "src/lib.rs"

[dependencies]
# Internal workspace crates — versions and paths declared once in [workspace.dependencies]
max-api.workspace = true
max-spawn.workspace = true
max-infra.workspace = true
max-config = { workspace = true, features = ["clap"] }
max-log.workspace = true
max-providers.workspace = true
max-memory.workspace = true
max-channels = { workspace = true, optional = true }
max-tools = { workspace = true, optional = true }
max-runtime = { workspace = true, optional = true }
max-tls = { workspace = true }
max-eval = { workspace = true, optional = true }
max-plugins = { workspace = true, optional = true }
max-gateway = { workspace = true, optional = true }
max-hardware = { workspace = true, optional = true }
max-tool-call-parser.workspace = true
max-macros.workspace = true
# CLI - minimal and fast
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap-markdown = "0.1"

# Async runtime - feature-optimized for size
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7", default-features = false }

# HTTP client - minimal features
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream", "socks"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Config
directories = "6.0"
toml = "1.0"

# JSON Schema generation for config export
schemars = { version = "1.2", optional = true }

# Logging - minimal

# URL encoding for web search
urlencoding = "2.1"

# Tarball extraction for binary updates
flate2 = "1"
tar = "0.4"

# Temp files (update pipeline rollback)
tempfile = "3.26"

# Zip extraction (plugin registry, self-update archives)
zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }

# Error handling
anyhow = "1.0"

# HMAC for webhook signature verification
sha2 = "0.10"
hex = "0.4"

# Async traits
async-trait = "0.1"

# Memory / persistence (migration.rs, behind agent-runtime)
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Interactive CLI prompts (memory CLI uses dialoguer unconditionally)
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.16"
crossterm = { version = "0.29", optional = true }

# Binary discovery (init system detection)
which = { version = "8.0", optional = true }

# WebSocket client channels (Discord/Lark/DingTalk/Nostr)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }

# HTTP server (gateway) — replaces raw TCP for proper HTTP/1.1 compliance
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"], optional = true }
tower = { version = "0.5", default-features = false, features = ["util"], optional = true }

# rust-embed removed — web dashboard served from filesystem via gateway.web_dist_dir

# Use the blocking HTTP exporter client to avoid Tokio-reactor panics in
# non-Tokio contexts.

# (Linux, macOS, Windows). Android/Termux uses target_os="android" and is excluded.

# Uses whatsapp-rust for Bot and Client, wacore for storage traits, custom rusqlite backend avoids Diesel conflict.

# Unix: the Quickstart checklist measures the terminal behind the descriptor
# it draws on (TIOCGWINSZ). Linux additionally uses it for `desktop --install`,
# which opens candidate `.desktop` entries with O_NONBLOCK|O_NOFOLLOW so a FIFO
# or symlink planted in an XDG data dir cannot block or redirect the read.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Installer/surface metadata: which `[features]` are internal aggregates or
# meta toggles rather than user-selectable rows. This bit is NOT derivable from
# the feature graph (e.g. `embedded-web` and `whatsapp-web` are structurally
# identical single cross-crate refs but one is meta and one is a real row), so
# it lives here in the canonical registry. install.sh and `cargo cmd convert`
# both read this; neither shadows it with its own list.
[package.metadata.max]
non_row_features = [
    "default",
    "default-channels",
    "channels-full",
    "ci-all",
    "fantoccini",
    "landlock",
    "metrics",
    "embedded-web",
]
# Features intentionally added to the lean Cargo defaults for standard
# distribution artifacts. This list is the complete positive policy beyond
# `default`; target-specific exclusions are resolved from the table below.
dist_extra_features = [
    "channel-matrix",
    "channel-lark",
    "channel-git",
    "whatsapp-web",
]

# Features whose build needs system C libraries or tooling the minimal static
# container image (StageX, no system package manager) does not provide. Excluded
# from the container kitchen-sink (Selection::All) so the all-features image
# builds; still available via source --features or a nix override. Not derivable
# from the feature graph, so it lives in the canonical registry.
container_excluded_features = [
    "voice-wake",
]

# Compatibility exclusions for standard distribution artifacts. Release
# workflows pass only their target triple; feature policy stays here.
[package.metadata.max.dist_target_exclusions]
aarch64-linux-android = ["whatsapp-web"]
arm-unknown-linux-gnueabihf = ["observability-prometheus"]
armv7-unknown-linux-gnueabihf = ["observability-prometheus"]

[features]
default = [
    "agent-runtime",
    "default-channels",
    "acp-bridge",
    "gateway",
    "observability-prometheus",
    "schema-export",
]

# The core agent runtime — agent loop, tools, persistence subsystems.
# Without this, you get the kernel: config + providers + memory + CLI chat.
# Channels are opt-in via the lean `default-channels` bundle, `channels-full`,
# or individual `channel-*` features.
agent-runtime = [
    "dep:max-runtime", "dep:max-eval", "dep:max-channels", "dep:max-tools",
    "dep:rusqlite",
    "dep:which",
    "dep:crossterm",
    "dep:tokio-tungstenite",
    "dep:rustls",
]

# Lean channel bundle included in `default`. These channels cover local/editor
# ACP, gateway/webhook ingress, and common first-run external chat/email paths.
default-channels = [
    "channel-acp-server", "channel-webhook",
    "channel-email", "channel-telegram", "channel-discord",
    "channel-filesystem",
]

# Historical broad channel bundle. Preserves the older default channel surface.
channels-full = [
    "default-channels", "max-channels/channels-full", "channel-lark",
    "channel-line",
    "channel-slack", "channel-signal",
    "channel-mattermost", "channel-irc", "channel-imessage",
    "channel-dingtalk", "channel-qq", "channel-bluesky", "channel-git",
    "channel-twitch", "channel-twitter", "channel-reddit", "channel-notion", "channel-mqtt", "channel-amqp",
    "channel-linq", "channel-nextcloud",
    "channel-mochat", "channel-wecom", "channel-wecom-ws", "channel-clawdtalk",
    "channel-whatsapp-cloud", "channel-voice-call",
]

# Major subsystems — each forwards to exactly ONE crate
gateway = [
    "dep:max-gateway",
    "dep:axum", "dep:tower",
]
schema-export = ["dep:schemars", "max-config/schema-export"]
acp-bridge = ["dep:tokio-tungstenite"]

# Channels — each forwards to max-channels.
channel-email = ["max-channels/channel-email", "max-gateway?/channel-email"]
channel-telegram = ["max-channels/channel-telegram"]
channel-lark = ["max-channels/channel-lark"]
channel-nostr = ["max-channels/channel-nostr"]
channel-matrix = ["max-channels/channel-matrix"]
channel-discord = ["max-channels/channel-discord"]
channel-slack = ["max-channels/channel-slack"]
channel-signal = ["max-channels/channel-signal"]
channel-mattermost = ["max-channels/channel-mattermost"]
channel-irc = ["max-channels/channel-irc"]
channel-twitch = ["max-channels/channel-twitch"]
channel-imessage = ["max-channels/channel-imessage"]
channel-dingtalk = ["max-channels/channel-dingtalk"]
channel-qq = ["max-channels/channel-qq"]
channel-bluesky = ["max-channels/channel-bluesky"]
channel-git = ["max-channels/channel-git"]
provider-github = ["max-channels/provider-github"]
provider-gitea = ["max-channels/provider-gitea"]
channel-twitter = ["max-channels/channel-twitter"]
channel-reddit = ["max-channels/channel-reddit"]
channel-notion = ["max-channels/channel-notion"]
channel-mqtt = ["max-channels/channel-mqtt"]
channel-filesystem = ["max-channels/channel-filesystem"]
channel-amqp = ["max-channels/channel-amqp"]
channel-linq = ["max-channels/channel-linq", "max-gateway?/channel-linq"]
channel-nextcloud = ["max-channels/channel-nextcloud", "max-gateway?/channel-nextcloud"]
channel-mochat = ["max-channels/channel-mochat"]
channel-wechat = ["max-channels/channel-wechat", "max-gateway?/channel-wechat"]
channel-wecom = ["max-channels/channel-wecom"]
channel-wecom-ws = ["max-channels/channel-wecom-ws"]
channel-clawdtalk = ["max-channels/channel-clawdtalk"]
channel-webhook = ["max-channels/channel-webhook"]
channel-acp-server = ["max-channels/channel-acp-server", "max-gateway?/channel-acp-server"]
channel-whatsapp-cloud = ["max-channels/channel-whatsapp-cloud", "max-gateway?/channel-whatsapp-cloud"]
channel-voice-call = ["max-channels/channel-voice-call"]
channel-line = ["max-channels/channel-line"]
# Feishu uses the same channel implementation as Lark; `use_feishu = true`
# selects Feishu endpoints at runtime.
channel-feishu = ["channel-lark"]
whatsapp-web = ["max-channels/whatsapp-web", "max-gateway?/whatsapp-web"]
voice-wake = ["max-channels/voice-wake"]
memory-postgres = ["max-memory/memory-postgres"]

# Backends and platform flags — each forwards to ONE crate
observability-prometheus = [
    "max-runtime/observability-prometheus",
    "max-gateway/observability-prometheus",
]
observability-otel = ["max-runtime/observability-otel"]
hardware = ["dep:max-hardware", "max-hardware/hardware"]
peripheral-rpi = ["dep:max-hardware", "max-hardware/peripheral-rpi"]
# Forwards `max-hardware/dev-sim`: extends the serial allow-list with
# `/tmp/zc-sim-*` for hardware-free simulation. Off by default; opt-in for the
# simulator and demo.
dev-sim = ["dep:max-hardware", "max-hardware/dev-sim"]
sandbox-landlock = ["max-runtime/sandbox-landlock"]
sandbox-bubblewrap = ["max-runtime/sandbox-bubblewrap"]
browser-native = ["max-tools/browser-native"]
plugins-wasm = [
    "dep:max-plugins",
    "max-runtime/plugins-wasm",
    "max-gateway?/plugins-wasm",
]
probe = ["dep:max-hardware", "max-hardware/probe"]
webauthn = ["max-runtime/webauthn", "max-gateway?/webauthn"]
embedded-web = ["max-gateway/embedded-web"]

# Backward-compatible aliases
fantoccini = ["browser-native"]
landlock = ["sandbox-landlock"]
metrics = ["observability-prometheus"]

# WASM plugin execution choice:
#
# Omit all three of the following features and there will not be any WASM plugin
# support at all — no plugin runtime, no WASM dependencies, and the plugin ABI
# surface will be unavailable in the agent runtime.
#
# Each feature adds a WASM execution strategy; enable the smallest set your targets
# need. `plugins-wasm-runtime-only` is implied by the other two. Every backend
# feature also implies `plugins-wasm` itself, so enabling any execution strategy
# always carries the plugin host and its CLI surface; a backend-only build
# cannot silently produce a binary without the `plugin` subcommand.
#
# - `plugins-wasm-runtime-only`: Fastest startup for plugins and smallest binary size,
#   but requires plugin authors to compile a specific version for each target
#   architecture (`.cwasm` files instead of `.wasm`) unless one of the two JIT
#   compilation feature flags is also used.
# - `plugins-wasm-cranelift`: Add the Cranelift JIT compilation engine on top of
#   the runtime which enables compiling WASM plugins on the host machine, but
#   results in larger binary size due to the Cranelift dependency. NOTE: Not
#   supported on all platforms (e.g., ARM32).
# - `plugins-wasm-pulley`: Most flexible, supports JIT compilation on targets
#   where Cranelift isn't available (e.g., ARM32), but has the slowest runtime
#   performance.
plugins-wasm-runtime-only = ["plugins-wasm", "max-plugins/plugins-wasmtime"]
plugins-wasm-cranelift    = ["plugins-wasm", "max-plugins/plugins-wasm-cranelift", "max-runtime/plugins-wasm-cranelift"]
plugins-wasm-pulley       = ["plugins-wasm", "max-plugins/plugins-wasm-pulley"]

# CI meta-feature
ci-all = [
    "agent-runtime",
    "channels-full",
    "channel-nostr", "channel-matrix", "whatsapp-web", "channel-wechat",
    "observability-prometheus", "observability-otel",
    "hardware", "peripheral-rpi",
    "sandbox-landlock", "sandbox-bubblewrap",
    "browser-native", "probe",
    "plugins-wasm", "plugins-wasm-cranelift",
    "webauthn", "memory-postgres",
]

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
opt-level = "z"      # Optimize for size
lto = "fat"          # Maximum cross-crate optimization for smaller binaries
codegen-units = 1    # Serialized codegen for low-memory devices (e.g., Raspberry Pi 3 with 1GB RAM)
                     # Higher values (e.g., 8) compile faster but require more RAM during compilation
strip = true          # Remove debug symbols
panic = "abort"      # Reduce binary size

[profile.release-fast]
inherits = "release"
codegen-units = 8    # Parallel codegen for faster builds on powerful machines (16GB+ RAM recommended)
                     # Use: cargo build --profile release-fast

[profile.ci]
inherits = "release"
lto = "thin"         # Much faster than fat LTO; still catches release-mode issues
codegen-units = 16   # Full parallelism for CI runners

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# Enables the runtime crate's test-only `ScopedToolRegistry::from_raw_for_test`
# so this package's integration-test helpers can mint the now-sealed engine tool
# registry. dev-dependency only: resolver v2 keeps `test-util` out of the shipped
# binary build, so the assemble()-only seal holds in production.
max-runtime = { workspace = true, features = ["test-util"] }
tempfile = "3.26"
criterion = { version = "0.8", features = ["async_tokio"] }
wiremock = "0.6"
scopeguard = "1.2"
rcgen = "0.13"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
# test-only: moved out of [dependencies] — no `src/` usage
base64 = "0.22"
hmac = "0.12"
parking_lot = "0.12"
regex = "1.10"
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

[[test]]
name = "component"
path = "tests/test_component.rs"

[[test]]
name = "integration"
path = "tests/test_integration.rs"

[[test]]
name = "system"
path = "tests/test_system.rs"

[[test]]
name = "live"
path = "tests/test_live.rs"

# Architecture invariant gates. Fail-on-detect for patterns that
# violate the workspace's ABSOLUTE RULE (AGENTS.md §1) — duplicate
# state across the codebase. Run with `cargo test --test architecture`
# during development; the workspace `cargo test` already includes it.
[[test]]
name = "architecture"
path = "tests/test_architecture.rs"

# Cross-crate activation proof: a configured channel plugin reaching a real
# WASM component. Needs `plugins-wasm-cranelift` and the wasm32-wasip2 target.
[[test]]
name = "plugin_channel_runtime_e2e"
path = "tests/plugin_channel_runtime_e2e.rs"

[[bench]]
name = "agent_benchmarks"
harness = false
