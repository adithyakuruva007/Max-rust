[package]
name = "max-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent evaluation harness for Max — Phase 0: deterministic replay of LLM trace fixtures through the real agent loop."
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
max-api.workspace = true
max-runtime.workspace = true
max-config.workspace = true
max-memory.workspace = true
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
regex = "1.10"
tempfile = "3.26"
tokio = { version = "1.50", default-features = false, features = ["rt", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros"] }
